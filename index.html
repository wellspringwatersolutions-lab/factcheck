<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Paste an AI answer or a claim for one free check. No sign-up.">
  <title>Check</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="alternate" href="llms.txt" type="text/plain" title="Site description for agents">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="top">
    <nav aria-label="Primary">
      <a href="how-it-works/">How it works</a>
      <a href="for-agents/">For AI agents</a>
      <a href="pricing/">Pricing</a>
    </nav>
  </header>
  <main id="main">
    <div class="stage">
      <h1 class="logo">
        <img src="img/mark.svg" alt="" width="40" height="40">
        <span data-product-name translate="no"></span>
      </h1>
      <form id="check-form" class="composer">
        <label class="visually-hidden" for="answer">Paste an AI answer or claim</label>
        <textarea id="answer" name="text" rows="2" placeholder="Paste an AI answer or claim" aria-describedby="fine-print"></textarea>
        <button type="submit" id="check-button" class="button-primary">Check</button>
        <p id="fine-print" class="fine">One free check, no sign-up</p>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <p id="pending" class="fine" hidden>Checking claims…</p>
      </form>
      <p id="status" class="visually-hidden" role="status"></p>
      <noscript><p class="fine">JavaScript is required to run a check in this preview.</p></noscript>
    </div>
    <div id="results"></div>
  </main>
  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="terms/">Terms</a>
      <a href="privacy/">Privacy</a>
    </nav>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/boot.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
